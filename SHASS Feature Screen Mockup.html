<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SHASS Feature Screen Mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=swap">
<style>
/* Layout: one 1920x1080 stage scaled to fit; left 1260px is the program strip, right 660px is the copy panel. */
:root {
  color-scheme: dark;
  --ground: #131019;        /* page behind the screen */
  --ground-2: #1e1928;      /* control surfaces */
  --line: #3a3149;
  --text: #ece8f3;
  --muted: #a79fb8;
  --violet: #a033ff;        /* highlight purple */
  --violet-ink: #8a1df0;    /* purple text on white */
  --deep-1: #2a0a5e;
  --deep-2: #3a0f7a;
  --deep-3: #4a1496;
  --panel: #ffffff;
  --ink: #0d0b12;
  --font: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--ground);
  color: var(--text);
  font-family: var(--font);
  padding-inline: 16px;
  padding-block: 20px 28px;
  box-sizing: border-box;
}
.wrap { max-width: 1500px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
.top h1 { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.top p { margin: 0; color: var(--muted); font-size: 13px; }

.frame {
  position: relative; width: 100%; max-width: 100%;
  aspect-ratio: 16 / 9; overflow: hidden;
  background: #000; border: 1px solid var(--line);
}
.frame:fullscreen { aspect-ratio: auto; width: 100vw; height: 100vh; border: 0; }
.stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  transform-origin: 0 0; background: var(--panel); overflow: hidden;
}

/* ---------- program strip ---------- */
.strip { position: absolute; left: 0; top: 0; width: 1260px; height: 1080px; overflow: hidden; background: var(--deep-1); }
.col {
  position: absolute; left: 0; top: 0; width: 180px; height: 1080px; overflow: hidden;
  will-change: transform;
  background-size: 1260px 1080px; background-position: left top; background-repeat: no-repeat;
}
.col::before { /* purple overlay */
  content: ""; position: absolute; inset: 0;
  background: var(--tint, var(--deep-2)); opacity: .88;
  transition: background-color .7s ease, opacity .7s ease;
}
.col.on::before { background: var(--violet); opacity: .8; }
.col::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.08); }
.vlabel {
  position: absolute; left: 0; top: 44px; width: 180px; height: 1000px;
  display: flex; align-items: center; justify-content: flex-start;
  writing-mode: vertical-rl; white-space: nowrap;
  font-weight: 800; font-size: 42px; letter-spacing: -0.01em; color: #fff;
  opacity: .82; transition: opacity .7s ease;
}
.col.on .vlabel, .spot .vlabel { opacity: 1; }

/* ---------- spotlight layer ---------- */
.spot {
  position: absolute; top: 0; left: 0; width: 180px; height: 1080px; overflow: hidden; z-index: 5;
  transition: left 1.1s cubic-bezier(.72,0,.16,1), width 1.1s cubic-bezier(.72,0,.16,1), opacity .35s ease;
}
.feed {
  position: absolute; left: 0; top: 0; width: 1260px;
  transition: transform .55s cubic-bezier(.75,0,.15,1), filter .9s ease;
  filter: grayscale(1);
}
.spot.open .feed { filter: none; }
.slide { position: relative; width: 1260px; height: 1080px; background-size: cover; background-position: center; }
.slide span {
  position: absolute; right: 64px; bottom: 30px; font-size: 19px; font-weight: 500;
  color: rgba(20,14,34,.75); letter-spacing: .04em; text-transform: uppercase;
  background: rgba(255,255,255,.7); padding: 8px 12px;
}
.spot-tint { position: absolute; inset: 0; background: var(--violet); opacity: .8; transition: opacity .9s ease; }
.spot.open .spot-tint { opacity: 0; }
.spot-grad {
  position: absolute; inset: 0; opacity: 0; transition: opacity .9s ease;
  background: linear-gradient(90deg, var(--violet) 0, rgba(160,51,255,.92) 9%, rgba(160,51,255,.45) 24%, rgba(160,51,255,0) 42%);
}
.spot.open .spot-grad { opacity: 1; }
.ticks {
  position: absolute; left: 1216px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 12px; opacity: 0; transition: opacity .5s ease .6s;
}
.spot.open .ticks { opacity: 1; }
.ticks i { display: block; width: 7px; height: 58px; background: rgba(255,255,255,.5); box-shadow: 0 0 0 1px rgba(20,14,34,.28); transition: background-color .3s; }
.ticks i.on { background: #fff; }

/* ---------- copy panel ---------- */
.panel { position: absolute; left: 1260px; top: 0; width: 660px; height: 1080px; background: var(--panel); color: var(--ink); }
.multi, .detail {
  position: absolute; inset: 0; padding: 84px 72px 80px 76px; box-sizing: border-box;
  transition: opacity .35s ease, transform .5s cubic-bezier(.2,.7,.2,1);
}
.multi h2 { margin: 0 0 44px; font-size: 58px; line-height: 1.04; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
.multi p, .detail p { margin: 0; font-size: 27px; line-height: 1.4; font-weight: 400; }
.multi .quote { margin: 48px 0 0 64px; color: var(--violet-ink); font-size: 25px; line-height: 1.36; }
.stats { position: absolute; left: 76px; bottom: 84px; display: flex; gap: 72px; }
.stats b { display: block; font-size: 76px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.stats span { display: block; margin-top: 12px; font-size: 22px; }
.detail { display: flex; flex-direction: column; gap: 34px; opacity: 0; transform: translateY(26px); }
.multi.swap { opacity: 0; transform: translateY(14px); }
.stage.spotlight .multi { opacity: 0; transform: translateY(-26px); }
.stage.spotlight .detail { opacity: 1; transform: none; transition-delay: .55s; }

/* ---------- controls under the screen ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.bar button {
  font: 600 14px/1 var(--font); color: var(--text); background: var(--ground-2);
  border: 1px solid var(--line); padding: 10px 14px; cursor: pointer;
}
.bar button:hover { border-color: var(--violet); }
.bar button:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
.status { color: var(--muted); font-size: 14px; min-width: 0; margin-left: auto; }
.note { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; max-width: 65ch; }
</style>

<div class="wrap">
  <div class="top">
    <h1>MIT SHASS feature screen, motion mockup</h1>
    <p>1920 × 1080, scaled to fit</p>
  </div>

  <div class="frame" id="frame">
    <div class="stage" id="stage">
      <div class="strip" id="strip">
        <div class="spot" id="spot" hidden>
          <div class="feed" id="feed"></div>
          <div class="spot-tint"></div>
          <div class="spot-grad"></div>
          <div class="vlabel" id="spotLabel"></div>
          <div class="ticks" id="ticks"></div>
        </div>
      </div>
      <div class="panel">
        <div class="multi" id="multi">
          <h2 id="mTitle"></h2>
          <p id="mBlurb"></p>
          <p class="quote" id="mQuote"></p>
          <div class="stats">
            <div><b id="s1"></b><span id="s1l"></span></div>
            <div><b id="s2"></b><span id="s2l"></span></div>
          </div>
        </div>
        <div class="detail" id="detail">
          <p id="d1"></p>
          <p id="d2"></p>
        </div>
      </div>
    </div>
  </div>

  <div class="bar">
    <button id="btnPlay" type="button">Pause</button>
    <button id="btnSpot" type="button">Spotlight now</button>
    <button id="btnFull" type="button">Fullscreen</button>
    <span class="status" id="status">Multi-program view</span>
  </div>
  <p class="note">Program names are real. Images, quotes, figures and the longer copy are stand-ins. All timing and sizes are constants at the top of the script.</p>
</div>

<script>
/* ---------- settings: change these to tune the motion ---------- */
const CFG = {
  driftPxPerSec: 14,     // how fast the columns slide left
  hopSeconds: 5.5,       // how long each highlight holds
  hopsBeforeSpot: [3, 4],// a spotlight opens after this many hops (random within range)
  slidesPerSpot: 4,      // images in the spotlight feed
  slideHoldSeconds: 2.8, // pause on each image
  expandSeconds: 1.1
};

/* ---------- content: this is what a CMS would supply ---------- */
const PROGRAMS = [
  { name: "Economics", motif: "chart",
    blurb: "Economics at MIT studies how people, firms and governments make choices, and tests those ideas against data.",
    more: "Students work on questions from poverty and labor markets to trade, finance and public policy." },
  { name: "History", motif: "shelves",
    blurb: "History examines how societies change over time and how the past shapes the problems we face now.",
    more: "Faculty work across regions and eras, with close reading of archives and primary sources." },
  { name: "Linguistics", motif: "waves",
    blurb: "Linguistics asks what all human languages share, how they differ, and how children come to speak them.",
    more: "The program treats language as a window into the structure of the mind." },
  { name: "Political Science", motif: "chart",
    blurb: "Political Science studies power, institutions and public decisions, from city councils to relations between states.",
    more: "Research ranges from elections and public opinion to security and political economy." },
  { name: "Music", motif: "waves",
    blurb: "Music brings performance, composition, history and technology together in studios, classrooms and concert halls.",
    more: "Ensembles and classes are open to students from every major at the Institute." },
  { name: "Comparative Media Studies/Writing", motif: "network",
    blurb: "Comparative Media Studies/Writing explores how media are made and understood, and teaches students to write for every audience.",
    more: "Work spans games, film, digital culture, journalism and science writing." },
  { name: "Global Languages", motif: "globe",
    blurb: "Global Languages teaches languages and cultures so that students can work and think across borders.",
    more: "Classes pair language study with literature, film and the study of culture." },
  { name: "Philosophy", motif: "circles",
    blurb: "Philosophy takes on basic questions about knowledge, mind, language, ethics and what there is.",
    more: "Students learn to build an argument carefully and to find the weak point in one." },
  { name: "Science, Technology, and Society", motif: "network",
    blurb: "Science, Technology, and Society studies how science and engineering shape the world, and how the world shapes them.",
    more: "The program draws on history, anthropology and sociology to study laboratories, machines and the people around them." },
  { name: "Theater Arts", motif: "stage",
    blurb: "Theater Arts is where students act, direct, design and write for live performance.",
    more: "Productions put new work and new stage technology in front of an audience." },
  { name: "Anthropology", motif: "circles",
    blurb: "Anthropology studies how people live, what they value and how communities hold together.",
    more: "Fieldwork takes students and faculty into communities, workplaces and institutions around the world." },
  { name: "Center for International Studies", motif: "globe",
    blurb: "The Center for International Studies supports research and teaching on global affairs and security.",
    more: "It connects MIT with scholars, practitioners and places around the world." },
  { name: "Literature", motif: "shelves",
    blurb: "Literature reads poems, novels, plays and films closely, and asks what stories do to us.",
    more: "Classes run from ancient epics to contemporary fiction and film." },
  { name: "Women's and Gender Studies", motif: "circles",
    blurb: "Women's and Gender Studies examines how gender shapes knowledge, work, culture and everyday life.",
    more: "Subjects are taught by faculty from across the school and the Institute." }
];
const SLOT_NOTE = "This space holds the longer program story: a current research project, a class that draws students from across the Institute, or a profile of someone in the program. The text is edited in the CMS and the layout adapts to its length.";

/* ---------- geometry ---------- */
const W = 1920, H = 1080, STRIP = 1260, COL = 180;
const N = PROGRAMS.length, TOTAL = N * COL;
const $ = id => document.getElementById(id);
const frame = $("frame"), stage = $("stage"), strip = $("strip"), spot = $("spot"), feed = $("feed");
const TINTS = ["var(--deep-1)", "var(--deep-2)", "var(--deep-3)"];
const pad = n => String(n).padStart(2, "0");
const label = i => pad(i + 1) + ". " + PROGRAMS[i].name;

/* ---------- placeholder image generator (stands in for real photos) ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const PALETTES = [
  ["#dfe3ea", "#a9b4c4", "#3f4a5e", "#f4f7fb"],
  ["#eadfcd", "#c9b08a", "#5a4735", "#faf4e8"],
  ["#d2e6e3", "#8dbdb7", "#2b5a56", "#f0faf8"],
  ["#f1d8cf", "#d89a85", "#693426", "#fdf0eb"]
];
const imgCache = {};
function makeImage(p, k) {
  const key = p + "-" + k; if (imgCache[key]) return imgCache[key];
  const cw = 840, ch = 720, c = document.createElement("canvas"); c.width = cw; c.height = ch;
  const g = c.getContext("2d"), r = rng(1000 + p * 97 + k * 13), [bg, mid, ink, hi] = PALETTES[(k + p) % 4];
  const grad = g.createLinearGradient(0, 0, cw * .3, ch); grad.addColorStop(0, hi); grad.addColorStop(1, bg);
  g.fillStyle = grad; g.fillRect(0, 0, cw, ch);
  const motif = PROGRAMS[p].motif, pick = () => [mid, ink, hi, bg][Math.floor(r() * 4)];
  if (motif === "shelves") {
    const rows = 5, rh = ch / rows;
    for (let y = 0; y < rows; y++) {
      let x = -10;
      while (x < cw) { const w = 12 + r() * 30, h = rh * (.55 + r() * .38); g.globalAlpha = .55 + r() * .45; g.fillStyle = pick(); g.fillRect(x, (y + 1) * rh - h - 8, w - 2, h); x += w; if (r() < .08) x += 30 + r() * 50; }
      g.globalAlpha = 1; g.fillStyle = ink; g.fillRect(0, (y + 1) * rh - 8, cw, 8);
    }
  } else if (motif === "waves") {
    for (let i = 0; i < 16; i++) {
      const y0 = 40 + i * (ch - 80) / 15, f = .006 + r() * .02, ph = r() * 6, amp = 14 + r() * 46;
      g.beginPath(); for (let x = 0; x <= cw; x += 6) { const y = y0 + Math.sin(x * f + ph) * amp * Math.sin(x / cw * Math.PI); x ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.strokeStyle = i % 3 ? ink : mid; g.globalAlpha = .35 + r() * .5; g.lineWidth = 1.5 + r() * 4; g.stroke();
    }
  } else if (motif === "chart") {
    g.globalAlpha = .25; g.strokeStyle = ink; g.lineWidth = 1;
    for (let y = 80; y < ch; y += 80) { g.beginPath(); g.moveTo(0, y); g.lineTo(cw, y); g.stroke(); }
    let v = .3 + r() * .3; const pts = [], n = 18, bw = cw / n;
    for (let i = 0; i < n; i++) { v = Math.min(.92, Math.max(.12, v + (r() - .42) * .16)); g.globalAlpha = .75; g.fillStyle = i % 4 === 0 ? ink : mid; g.fillRect(i * bw + 6, ch - v * ch * .8, bw - 12, v * ch * .8); pts.push([i * bw + bw / 2, ch - v * ch * .8 - 60 - r() * 60]); }
    g.globalAlpha = 1; g.strokeStyle = ink; g.lineWidth = 4; g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.stroke();
    g.fillStyle = hi; pts.forEach(q => { g.beginPath(); g.arc(q[0], q[1], 7, 0, 7); g.fill(); g.stroke(); });
  } else if (motif === "globe") {
    const cx = cw * (.35 + r() * .4), cy = ch * (.4 + r() * .3), R = 240 + r() * 120;
    g.fillStyle = mid; g.globalAlpha = .5; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill();
    g.globalAlpha = .7; g.strokeStyle = ink; g.lineWidth = 2.5;
    for (let i = 1; i <= 6; i++) { g.beginPath(); g.ellipse(cx, cy, R * i / 6, R, 0, 0, 7); g.stroke(); g.beginPath(); g.ellipse(cx, cy, R, R * i / 6, 0, 0, 7); g.stroke(); }
    for (let i = 0; i < 5; i++) { g.globalAlpha = .2; g.beginPath(); g.arc(cx, cy, R + 50 + i * 60, 0, 7); g.stroke(); }
  } else if (motif === "network") {
    const nodes = Array.from({ length: 30 }, () => [r() * cw, r() * ch, 5 + r() * 16]);
    g.strokeStyle = ink; g.lineWidth = 2;
    nodes.forEach((a, i) => nodes.forEach((b, j) => { if (j > i && Math.hypot(a[0] - b[0], a[1] - b[1]) < 210) { g.globalAlpha = .4; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); } }));
    nodes.forEach(a => { g.globalAlpha = .9; g.fillStyle = r() < .3 ? ink : mid; g.beginPath(); g.arc(a[0], a[1], a[2], 0, 7); g.fill(); });
  } else if (motif === "stage") {
    g.fillStyle = ink; g.globalAlpha = .75; g.fillRect(0, 0, cw, ch);
    for (let i = 0; i < 4; i++) { const x = cw * (.15 + r() * .7), bx = x + (r() - .5) * 300, lg = g.createLinearGradient(0, 0, 0, ch); lg.addColorStop(0, hi); lg.addColorStop(1, "rgba(255,255,255,0)"); g.globalAlpha = .45; g.fillStyle = lg; g.beginPath(); g.moveTo(x - 12, 0); g.lineTo(x + 12, 0); g.lineTo(bx + 170, ch); g.lineTo(bx - 170, ch); g.fill(); }
    g.globalAlpha = .8; g.fillStyle = mid; g.beginPath(); g.ellipse(cw / 2, ch + 40, cw * .7, 150, 0, 0, 7); g.fill();
  } else {
    g.globalCompositeOperation = "multiply";
    for (let i = 0; i < 8; i++) { g.globalAlpha = .45; g.fillStyle = i % 2 ? mid : bg; g.beginPath(); g.arc(r() * cw, r() * ch, 110 + r() * 220, 0, 7); g.fill(); }
    g.globalCompositeOperation = "source-over"; g.globalAlpha = .6; g.strokeStyle = ink; g.lineWidth = 3;
    for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(r() * cw, r() * ch, 90 + r() * 200, 0, 7); g.stroke(); }
  }
  g.globalAlpha = .06; g.fillStyle = "#000"; for (let i = 0; i < 7000; i++) g.fillRect(r() * cw, r() * ch, 1.5, 1.5);
  return imgCache[key] = c.toDataURL("image/jpeg", .82);
}

/* ---------- build the columns ---------- */
const cols = PROGRAMS.map((p, i) => {
  const el = document.createElement("div");
  el.className = "col"; el.style.setProperty("--tint", TINTS[i % 3]);
  el.style.backgroundImage = `url(${makeImage(i, 0)})`;
  const l = document.createElement("div"); l.className = "vlabel"; l.textContent = label(i);
  el.appendChild(l); strip.insertBefore(el, spot); return el;
});

/* Numbers run high to low from the left, as in the sketch, so new programs enter from the right. */
let offset = COL;
function colX(i) { let x = (((N - 1 - i) * COL - offset) % TOTAL + TOTAL) % TOTAL; if (x > TOTAL - COL) x -= TOTAL; return x; }
function place() { for (let i = 0; i < N; i++) { const x = colX(i); cols[i].style.transform = `translateX(${x}px)`; cols[i].style.visibility = x < STRIP ? "visible" : "hidden"; } }

/* ---------- copy panel ---------- */
function statsFor(i) { const r = rng(77 + i * 31); return [20 + Math.floor(r() * 60), 400 + Math.floor(r() * 1400)]; }
function fillMulti(i) {
  const p = PROGRAMS[i], [a, b] = statsFor(i);
  $("mTitle").textContent = p.name; $("mBlurb").textContent = p.blurb;
  $("mQuote").textContent = "A short quote from a student or faculty member in " + p.name + " goes here, in their own words.";
  $("s1").textContent = a; $("s1l").textContent = "Faculty"; $("s2").textContent = b.toLocaleString("en-US"); $("s2l").textContent = "Students enrolled";
}
function fillDetail(i) { const p = PROGRAMS[i]; $("d1").textContent = p.blurb + " " + p.more; $("d2").textContent = SLOT_NOTE; }

/* ---------- clock: waits and drift both stop while paused ---------- */
let paused = matchMedia("(prefers-reduced-motion: reduce)").matches, drifting = true, skip = false, last = performance.now();
function wait(sec, skippable) {
  return new Promise(res => { let t = 0, prev = performance.now();
    (function tick(now) { const dt = Math.min(100, now - prev); prev = now; if (!paused) t += dt; if (t >= sec * 1000 || (skippable && skip)) res(); else requestAnimationFrame(tick); })(prev); });
}
function loop(now) { const dt = Math.min(100, now - last); last = now; if (!paused && drifting) { offset += CFG.driftPxPerSec * dt / 1000; place(); } requestAnimationFrame(loop); }

/* ---------- highlight hops ---------- */
let current = 8;
function setHighlight(i, instant) {
  cols.forEach((c, j) => c.classList.toggle("on", j === i)); current = i;
  if (instant) return fillMulti(i);
  const m = $("multi"); m.classList.add("swap"); setTimeout(() => { fillMulti(i); m.classList.remove("swap"); }, 300);
}
function pickNext() {
  const safe = CFG.driftPxPerSec * CFG.hopSeconds + 20, list = [];
  for (let i = 0; i < N; i++) { const x = colX(i); if (i !== current && x >= safe && x <= STRIP - COL) list.push(i); }
  return list[Math.floor(Math.random() * list.length)];
}

/* ---------- spotlight ---------- */
function setTick(k) { [...$("ticks").children].forEach((t, j) => t.classList.toggle("on", j === k)); }
async function spotlight(i) {
  drifting = false; const x = Math.round(colX(i)), n = CFG.slidesPerSpot;
  feed.innerHTML = ""; $("ticks").innerHTML = "";
  for (let k = 0; k < n; k++) {
    const s = document.createElement("div"); s.className = "slide"; s.style.backgroundImage = `url(${makeImage(i, k)})`;
    const tag = document.createElement("span"); tag.textContent = `Placeholder image ${k + 1} / ${n}`; s.appendChild(tag); feed.appendChild(s);
    $("ticks").appendChild(document.createElement("i"));
  }
  feed.style.transform = "translateY(0)"; setTick(0); $("spotLabel").textContent = label(i); fillDetail(i);
  spot.style.transition = "none"; spot.style.left = x + "px"; spot.style.width = COL + "px"; spot.style.opacity = 1; spot.hidden = false;
  void spot.offsetWidth; spot.style.transition = "";
  spot.style.left = "0px"; spot.style.width = STRIP + "px"; spot.classList.add("open"); stage.classList.add("spotlight");
  $("status").textContent = "Program spotlight: " + PROGRAMS[i].name;
  await wait(CFG.expandSeconds + .2);
  for (let k = 1; k < n; k++) { await wait(CFG.slideHoldSeconds); feed.style.transform = `translateY(${-k * H}px)`; setTick(k); }
  await wait(CFG.slideHoldSeconds);
  spot.classList.remove("open"); stage.classList.remove("spotlight"); spot.style.left = x + "px"; spot.style.width = COL + "px";
  $("status").textContent = "Multi-program view";
  await wait(CFG.expandSeconds + .1); spot.style.opacity = 0; await wait(.4); spot.hidden = true; drifting = true;
}

/* ---------- the show ---------- */
async function run() {
  setHighlight(current, true);
  for (;;) {
    const [lo, hi] = CFG.hopsBeforeSpot, hops = lo + Math.floor(Math.random() * (hi - lo + 1));
    for (let h = 0; h < hops && !skip; h++) { await wait(CFG.hopSeconds, true); if (skip) break; if (h < hops - 1) setHighlight(pickNext()); }
    skip = false; await spotlight(current); setHighlight(pickNext());
  }
}

/* ---------- fit the stage and wire the controls ---------- */
function fit() { const r = frame.getBoundingClientRect(), s = Math.min(r.width / W, r.height / H); stage.style.transform = `translate(${(r.width - W * s) / 2}px, ${(r.height - H * s) / 2}px) scale(${s})`; }
new ResizeObserver(fit).observe(frame); document.addEventListener("fullscreenchange", fit); fit();
const btnPlay = $("btnPlay"); btnPlay.textContent = paused ? "Play" : "Pause";
btnPlay.addEventListener("click", () => { paused = !paused; btnPlay.textContent = paused ? "Play" : "Pause"; });
$("btnSpot").addEventListener("click", () => { if (!stage.classList.contains("spotlight")) { skip = true; if (paused) btnPlay.click(); } });
$("btnFull").addEventListener("click", () => { const p = document.fullscreenElement ? document.exitFullscreen() : frame.requestFullscreen && frame.requestFullscreen(); if (p && p.catch) p.catch(() => {}); });
place(); requestAnimationFrame(loop); run();
</script>
